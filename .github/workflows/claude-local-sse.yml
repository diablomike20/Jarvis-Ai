name: JARVIS Real Claude Source CLI Local SSE Acceptance

on:
  push:
    branches:
      - feature/jarvis-nextgen-working-runtime-20261011
    paths:
      - 'scripts/local_sse_acceptance.py'
      - '.github/workflows/claude-local-sse.yml'
      - 'installer/prepare_claude_runtime.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-cli-protocol:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Build exact custom master-derived Claude CLI
        shell: pwsh
        env:
          JARVIS_CLAUDE_UNMINIFIED: '1'
        run: ./installer/prepare_claude_runtime.ps1
      - name: Exercise actual Node CLI and structured JSONL against local Anthropic SSE server
        shell: pwsh
        run: python scripts/local_sse_acceptance.py --cli runtime/claude-code/dist/cli.js --node runtime/node/node.exe --timeout 100
      - name: Exercise live prompt overflow and original Claude compaction recovery
        shell: pwsh
        run: python scripts/local_sse_acceptance.py --cli runtime/claude-code/dist/cli.js --node runtime/node/node.exe --scenario overflow --timeout 150
