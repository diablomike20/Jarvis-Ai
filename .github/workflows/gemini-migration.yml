name: Gemini replacement checks

on:
  push:
    branches:
      - remove-gemini-openrouter-local
  pull_request:
    branches:
      - main
      - remove-gemini-openrouter-local

jobs:
  syntax-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile main.py
        run: python -m py_compile main.py
      - name: Compile ui.py
        run: python -m py_compile ui.py
      - name: Compile API clients
        run: python -m py_compile llm_client.py or_client.py
      - name: Compile supporting modules
        run: python -m compileall -q actions agent core memory
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy requests pytest
      - name: Run Gemini migration tests
        run: |
          python -m pytest -q tests/test_gemini_migration.py
