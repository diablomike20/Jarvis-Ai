name: Hungarian voice corpus prep checks
on:
  push:
    branches:
      - prep/jarvis-hu-film-voice-corpus-20261012
    paths:
      - tools/voice_corpus/**
      - tests/test_voice_corpus_prep.py
      - tests/test_voice_tts_compare.py
      - tests/test_voice_reference_preflight.py
      - tests/test_marecord_bootstrap.py
      - tests/test_voice_style_variants.py
      - tests/test_local_transcribe_hu.py
      - .github/workflows/voice-corpus-prep.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-unit-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax checks
        run: python -m py_compile tools/voice_corpus/*.py tests/test_voice_corpus_prep.py tests/test_voice_tts_compare.py tests/test_voice_reference_preflight.py tests/test_marecord_bootstrap.py tests/test_voice_style_variants.py tests/test_local_transcribe_hu.py
      - name: Offline privacy and mock TTS tests
        run: |
          python -m unittest discover -s tests -p 'test_voice_corpus_prep.py' -v
          python -m unittest discover -s tests -p 'test_voice_tts_compare.py' -v
          python -m unittest discover -s tests -p 'test_voice_reference_preflight.py' -v
          python -m unittest discover -s tests -p 'test_marecord_bootstrap.py' -v
          python -m unittest discover -s tests -p 'test_voice_style_variants.py' -v
          python -m unittest discover -s tests -p 'test_local_transcribe_hu.py' -v
