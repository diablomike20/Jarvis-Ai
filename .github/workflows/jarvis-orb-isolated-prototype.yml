name: JARVIS isolated orb prototype
on:
  push:
    branches:
      - feature/jarvis-orb-isolated-prototype
      - feature/jarvis-orb-qt-benchmark
  pull_request:
    branches:
      - feature/jarvis-authorized-hu-xtts-integration

permissions:
  contents: read

jobs:
  orb-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/jarvis-orb-web-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone Qt launcher without importing GUI
        run: |
          python3 -m py_compile tools/qt_bridge_contract.py tools/qt_orb_lab.py
          python3 -m unittest discover -s tests -p 'test_qt_bridge_contract.py' -v
      - name: Install isolated React/Three.js demo dependencies
        run: npm install --no-audit --no-fund
      - name: Test JARVIS voice-state adapter
        run: npm test
      - name: Build genuine npm orb component
        run: npm run build
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Start isolated demo and unchanged original animation
        run: |
          (npm run dev -- --port 5173 > /tmp/orb-demo.log 2>&1 &)
          (python3 -m http.server 8769 --directory ../../assets/web_background > /tmp/orb-original.log 2>&1 &)
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null && curl --fail --silent http://127.0.0.1:8769/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/orb-demo.log
          exit 1
      - name: Test visual states and browser metrics
        env:
          ORB_BASE_URL: http://127.0.0.1:5173
          ORB_LEGACY_URL: http://127.0.0.1:8769/index.html
        run: npm run smoke
      - name: Compare UI frame cadence and Chromium task metrics
        env:
          ORB_BASE_URL: http://127.0.0.1:5173
          ORB_LEGACY_URL: http://127.0.0.1:8769/index.html
        run: npm run benchmark
      - name: Save screenshots and performance data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-orb-qt-benchmark-evidence
          path: experiments/jarvis-orb-web-demo/perf-results/
          if-no-files-found: warn
