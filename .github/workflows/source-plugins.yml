name: Creative source plugin checks

on:
  push:
    branches:
      - feature/creative-studio-multiapp
      - feature/universal-source-adapters
      - feature/universal-source-adapters
      - feature/freecad-native-jarvis
      - feature/controlled-self-evolution
      - feature/jarvis-ai-visual-rebrand
  pull_request:
    branches:
      - main
      - remove-gemini-openrouter-local
      - feature/creative-studio-multiapp

jobs:
  source-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax validation
        run: |
          python -m py_compile main.py actions/creative_studio.py actions/creative_intent.py actions/source_plugins.py actions/source_intent.py actions/source_cli_adapter.py actions/freecad_plugin.py integrations/sources/freecad/freecad_worker.py core/local_brain.py core/skill_crucible.py core/skill_forge.py core/dynamic_registry.py core/identity.py ui.py actions/auto_heal_engine.py agent/executor.py
      - name: Dependencies for bridge tests
        run: |
          python -m pip install -q pytest requests numpy
      - name: Run generic source plugin tests
        run: python -m pytest -q tests/test_source_plugins.py
      - name: Run Creative Studio editor tests
        run: python -m pytest -q tests/test_creative_studio.py
      - name: Run generic CLI source adapter tests
        run: python -m pytest -q tests/test_source_cli_adapter.py
      - name: Run FreeCAD native adapter tests
        run: python -m pytest -q tests/test_freecad_plugin.py
      - name: Controlled self-evolution and Auto-Heal tests
        run: python -m pytest -q tests/test_skill_forge.py tests/test_controlled_autoheal.py
      - name: Brand and legacy conversation label tests
        run: python -m pytest -q tests/test_jarvis_ui_branding.py
