name: Authorized Hungarian XTTS routing checks

on:
  push:
    branches:
      - feature/jarvis-authorized-hu-xtts-integration
  pull_request:
    branches:
      - feature/jarvis-ai-visual-rebrand

jobs:
  voice-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile integrated voice routing
        run: |
          python -m py_compile actions/jarvis_voice.py actions/voice_reference.py actions/attention_monitor.py main.py ui.py
      - name: Install test runner only (no XTTS model or voice data)
        run: python -m pip install -q pytest
      - name: Run synthetic WAV and routing regression tests
        run: python -m pytest -q tests/test_authorized_hungarian_voice.py tests/test_jarvis_voice_settings.py tests/test_voice_reference.py

  windows-voice-compatibility:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Windows voice and desktop UI modules
        run: python -m py_compile actions/jarvis_voice.py actions/voice_reference.py actions/attention_monitor.py main.py ui.py
      - name: Install test framework only (no reference or model)
        run: python -m pip install -q pytest
      - name: Validate synthetic audio conversion and voice routing under Windows
        run: python -m pytest -q tests/test_authorized_hungarian_voice.py tests/test_jarvis_voice_settings.py tests/test_voice_reference.py
